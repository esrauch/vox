<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Screen Inspector · Dev</title>
    <link rel="stylesheet" href="/src/dev/screenInspector.css" />
  </head>
  <body>
    <!-- Dev tool (M1.2): step the simulation by hand. Excluded by `npm run build:release`. -->
    <header>
      <a href="./">← dev</a>
      <strong>Screen inspector</strong>
      <span id="status"></span>
    </header>
    <div id="grid"></div>
    <div class="controls">
      <button id="hike">Hike</button>
      <button id="step">Step</button>
      <button id="auto">Auto ▶</button>
      <button id="next">Next screen</button>
      <button id="reset">New run</button>
      <label>seed <input id="seed" type="number" /></label>
    </div>
    <p class="help" id="help"></p>
    <ol id="log" reversed></ol>
    <script type="module" src="/src/dev/screenInspector.ts"></script>
  </body>
</html>
